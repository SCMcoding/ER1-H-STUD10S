<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISS‑Style Station • Slow Float + Blinking & Twinkling Stars</title>
<style>
/* —— RESET —— */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;font-family:system-ui;overflow:hidden}

/* —— EARTH —— */
.earth{
  position:fixed;left:-60vw;bottom:-35vh;width:220vw;height:130vh;
  background:radial-gradient(ellipse at center,
      #3a2418 0%,#261912 40%,#130f0d 55%,transparent 70%);
  animation: earthShift 160s linear infinite;
}
.earth::before{
  content:"";position:absolute;inset:-2%;
  background:radial-gradient(ellipse at center,
      rgba(210,138,59,.34) 45%,rgba(155,107,211,.10) 51%,transparent 57%);
  filter:blur(4px);
}
@keyframes earthShift{to{transform:translateX(-12vw)}}

/* —— STARFIELD (gentle twinkle layers) —— */
.star{position:fixed;inset:0;pointer-events:none}
.star.l1{opacity:.95;animation:tw1 7s linear infinite}
.star.l2{opacity:.6; animation:tw2 10s linear infinite}
.star.l3{opacity:.4; animation:tw3 14s linear infinite}
@keyframes tw1{50%{opacity:.25;transform:translateY(2px)}}
@keyframes tw2{50%{opacity:.15;transform:translateY(3px)}}
@keyframes tw3{50%{opacity:.08; transform:translateY(4px)}}

/* —— NEW: blinking star layer —— */
@keyframes blinkStar{
  0%,100%{opacity:0}
  50%    {opacity:1}
}
.blink{
  position:fixed;inset:0;pointer-events:none;
  box-shadow:
    10vw 20vh 2px #fff,30vw 10vh 2px #fff,50vw 80vh 2px #fff,
    70vw 35vh 2px #fff,85vw 60vh 2px #fff,
    /* duplicate above a screen for seamless scroll */
    10vw calc(20vh-100vh) 2px #fff,30vw calc(10vh-100vh) 2px #fff,
    50vw calc(80vh-100vh) 2px #fff,70vw calc(35vh-100vh) 2px #fff,
    85vw calc(60vh-100vh) 2px #fff;
  animation:blinkStar 1.6s linear infinite;
}

/* stagger three identical blink layers so flashes aren’t in sync */
.blink.d2{animation-delay:.4s}
.blink.d3{animation-delay:.8s}

/* —— dot lists for twinkle layers (unchanged) —— */
.star.l1{box-shadow:
  4vw 10vh 1px #fff,12vw 83vh 2px #dfe9ff,19vw 41vh 1px #fff,
  26vw 73vh 2px #cad7ff,33vw 17vh 1px #fff,40vw 58vh 1px #fff,
  47vw 92vh 2px #e8f1ff,54vw 27vh 1px #fff,61vw 69vh 2px #cad7ff,
  68vw 9vh 1px #fff,75vw 52vh 1px #fff,82vw 80vh 2px #e8f1ff,
  89vw 32vh 1px #fff,96vw 62vh 1px #fff,
  4vw calc(10vh-100vh) 1px #fff,12vw calc(83vh-100vh) 2px #dfe9ff,
  19vw calc(41vh-100vh) 1px #fff,26vw calc(73vh-100vh) 2px #cad7ff,
  33vw calc(17vh-100vh) 1px #fff,40vw calc(58vh-100vh) 1px #fff,
  47vw calc(92vh-100vh) 2px #e8f1ff,54vw calc(27vh-100vh) 1px #fff,
  61vw calc(69vh-100vh) 2px #cad7ff,68vw calc(9vh-100vh) 1px #fff,
  75vw calc(52vh-100vh) 1px #fff,82vw calc(80vh-100vh) 2px #e8f1ff,
  89vw calc(32vh-100vh) 1px #fff,96vw calc(62vh-100vh) 1px #fff;}
.star.l2{box-shadow:
  8vw 23vh 1px #fff,30vw 92vh 1px #c8d6ff,52vw 25vh 1px #fff,
  74vw 66vh 1px #cfd9ff,90vw 41vh 1px #fff,
  8vw calc(23vh-100vh) 1px #fff,30vw calc(92vh-100vh) 1px #c8d6ff,
  52vw calc(25vh-100vh) 1px #fff,74vw calc(66vh-100vh) 1px #cfd9ff,
  90vw calc(41vh-100vh) 1px #fff;}
.star.l3{box-shadow:
  15vw 5vh 1px #fff,45vw 15vh 1px #e6eeff,65vw 85vh 1px #fff,
  85vw 55vh 1px #d4e0ff,15vw calc(5vh-100vh) 1px #fff,
  45vw calc(15vh-100vh) 1px #e6eeff,65vw calc(85vh-100vh) 1px #fff,
  85vw calc(55vh-100vh) 1px #d4e0ff;}

/* —— STATION —— */
.station{
  position:absolute;top:50%;left:50%;width:580px;height:310px;
  transform-origin:center;
  animation:spin 200s linear infinite,bob 14s ease-in-out infinite;
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes bob{50%{transform:translate(-50%,-51%) rotate(180deg)}}

/* —— SVG palette —— */
.module{fill:#34372d;stroke:#d7d7d0;stroke-width:2}
.truss {fill:#25271f;stroke:#9aa060;stroke-width:3}
.array {fill:url(#stripe);stroke:#9b6bd3;stroke-width:1.4}
.radiator{fill:#37382f;stroke:#d28a3b;stroke-width:1.4}
.arm   {stroke:#d7d7d0;stroke-width:2;stroke-linecap:round}
.cupola{fill:#241d2e;stroke:#9b6bd3;stroke-width:2}
.nav   {fill:#d28a3b;animation:blinkNav 1.4s linear infinite}
@keyframes blinkNav{50%{opacity:.2}}
.shadow{fill:rgba(0,0,0,.14)}


/* CHIVISPUPPETS THEME LAYERS */
:root{--orange:#d28a3b;--green:#9aa060;--purple:#9b6bd3}
.spaceGlow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 20%,rgba(210,138,59,.12),transparent 25%),radial-gradient(circle at 80% 68%,rgba(210,138,59,.16),transparent 30%),radial-gradient(circle at 68% 14%,rgba(155,107,211,.12),transparent 25%)}
.milkyway{position:absolute;left:-18%;top:37%;width:140%;height:260px;transform:rotate(-16deg);opacity:.3;filter:blur(7px);background:radial-gradient(ellipse,rgba(155,107,211,.20),rgba(210,138,59,.13) 25%,rgba(210,138,59,.10) 43%,transparent 72%)}
#newStars,#dataField,#wordField{position:fixed;inset:0;pointer-events:none}
#newStars{z-index:1}#dataField,#wordField{z-index:3}
.dot{position:absolute;border-radius:50%;animation:ctw var(--s) ease-in-out infinite alternate}
.dot.orange{background:var(--orange);box-shadow:0 0 7px var(--orange)}.dot.green{background:var(--green);box-shadow:0 0 7px var(--green)}.dot.purple{background:var(--purple);box-shadow:0 0 8px var(--purple)}.dot.white{background:#fff;box-shadow:0 0 6px #fff}
@keyframes ctw{from{opacity:.12;transform:scale(.65)}to{opacity:.95;transform:scale(1.25)}}
.data{position:absolute;font:700 9px "Courier New",monospace;letter-spacing:1px;opacity:.43;text-shadow:0 0 8px currentColor;white-space:nowrap}
.word{position:absolute;font:700 16px "Courier New",monospace;letter-spacing:5px;opacity:.25;text-shadow:0 0 13px currentColor;white-space:nowrap;animation:wfloat var(--ws) ease-in-out infinite alternate}
.orange{color:var(--orange)}.green{color:var(--green)}.purple{color:var(--purple)}
@keyframes wfloat{from{transform:translate(-10px,8px)}to{transform:translate(22px,-18px)}}
.station{z-index:5;filter:drop-shadow(0 18px 18px rgba(0,0,0,.65)) drop-shadow(0 0 18px rgba(155,107,211,.16));animation:stationFloat 100s cubic-bezier(.45,.05,.55,.95) infinite}
@keyframes stationFloat{0%{transform:translate(-52%,-48%) rotate(-7deg) scale(.94)}25%{transform:translate(-47%,-53%) rotate(2deg) scale(1)}50%{transform:translate(-51%,-49%) rotate(8deg) scale(.97)}75%{transform:translate(-54%,-46%) rotate(0deg) scale(1.02)}100%{transform:translate(-52%,-48%) rotate(-7deg) scale(.94)}}
.tag{position:fixed;z-index:6;left:50%;bottom:6%;transform:translateX(-50%);font:10px "Courier New",monospace;letter-spacing:4px;color:var(--green);opacity:.7;text-shadow:0 0 8px rgba(154,160,96,.5);white-space:nowrap}

/* REFINED ORBITAL STATION */
.station{width:min(900px,88vw);aspect-ratio:900/420;perspective:900px;filter:drop-shadow(0 22px 24px rgba(0,0,0,.75)) drop-shadow(0 0 12px rgba(210,138,59,.10))}
.station svg{overflow:visible;transform:rotateX(4deg) rotateY(-5deg)}
.module{fill:url(#moduleMetal)!important;stroke:#d8d5c5!important;stroke-width:1.3!important}
.truss{fill:#24251f!important;stroke:#89905c!important;stroke-width:2!important}
.array{fill:url(#solarNew)!important;stroke:#9b6bd3!important;stroke-width:1.1!important;filter:drop-shadow(0 0 4px rgba(155,107,211,.18))}
.radiator{fill:url(#radiatorNew)!important;stroke:#d28a3b!important;stroke-width:1!important}
.arm{stroke:#bfc1ad!important;stroke-width:1.5!important}
.cupola{fill:#17131d!important;stroke:#9b6bd3!important;stroke-width:1.4!important}
.station .shadow{opacity:.05}
.station:after{content:"";position:absolute;left:18%;right:18%;top:46%;height:14%;background:radial-gradient(ellipse,rgba(210,138,59,.08),transparent 68%);filter:blur(18px);pointer-events:none}

/* WARM ORANGE COSMIC ENVIRONMENT */
.spaceGlow{
  background:
    radial-gradient(circle at 15% 20%,rgba(255,159,67,.19),transparent 26%),
    radial-gradient(circle at 82% 70%,rgba(210,138,59,.17),transparent 31%),
    radial-gradient(circle at 68% 12%,rgba(155,107,211,.12),transparent 25%),
    radial-gradient(circle at 50% 105%,rgba(179,84,43,.18),transparent 38%);
}
.milkyway{
  opacity:.40;
  background:radial-gradient(ellipse,
    rgba(210,138,59,.24),
    rgba(179,84,43,.16) 24%,
    rgba(155,107,211,.11) 43%,
    transparent 72%);
}

/* organic galaxies */
.cosmic-galaxy{position:fixed;z-index:1;border-radius:50%;pointer-events:none;opacity:.46;filter:blur(5px);animation:galaxyDrift 34s ease-in-out infinite alternate}
.cosmic-galaxy:before,.cosmic-galaxy:after{content:"";position:absolute;inset:0;border-radius:50%}
.cosmic-galaxy:before{transform:rotate(var(--tilt)) scaleY(.34);background:
 radial-gradient(ellipse at center,rgba(255,238,211,.9) 0 1.5%,rgba(255,184,95,.46) 4%,rgba(210,138,59,.20) 15%,rgba(155,107,211,.10) 31%,transparent 58%);
 filter:blur(7px)}
.cosmic-galaxy:after{inset:18%;transform:rotate(calc(var(--tilt) + 32deg)) scaleY(.26);border:1px solid rgba(210,138,59,.12);filter:blur(4px)}
.galaxyA{width:390px;height:220px;left:-4%;top:8%;--tilt:-18deg}
.galaxyB{width:470px;height:250px;right:-8%;top:54%;--tilt:14deg;opacity:.37}
.galaxyC{width:230px;height:130px;right:12%;top:8%;--tilt:-8deg;opacity:.32}
@keyframes galaxyDrift{from{transform:translate(0,0) rotate(-1deg)}to{transform:translate(18px,-12px) rotate(2deg) scale(1.05)}}

/* warmer stars and telemetry */
.dot.green{background:var(--orange);box-shadow:0 0 7px var(--orange)}
.data.green,.word.green{color:#e2a151}
.earth{filter:saturate(.92) sepia(.15)}


/* REALISTIC DEEP-SPACE PASS */
body{background:#010102}
.spaceGlow{
  background:
    radial-gradient(circle at 14% 18%,rgba(210,138,59,.075),transparent 24%),
    radial-gradient(circle at 78% 68%,rgba(179,84,43,.055),transparent 30%),
    radial-gradient(circle at 66% 12%,rgba(155,107,211,.045),transparent 23%),
    linear-gradient(#010102,#020203 55%,#000);
}
.milkyway{
  opacity:.22;filter:blur(10px);
  background:radial-gradient(ellipse,rgba(236,214,187,.13),rgba(210,138,59,.065) 24%,rgba(155,107,211,.035) 42%,transparent 72%);
}
.cosmic-galaxy{opacity:.20;filter:blur(8px)}
.cosmic-galaxy:before{
  background:radial-gradient(ellipse at center,rgba(255,245,225,.65) 0 1%,rgba(230,190,145,.20) 5%,rgba(210,138,59,.08) 17%,rgba(155,107,211,.035) 31%,transparent 60%);
}
.cosmic-galaxy:after{border-color:rgba(210,138,59,.045)}
.galaxyB{opacity:.16}.galaxyC{opacity:.13}

/* Extra star depth */
.faint-star{position:absolute;border-radius:50%;background:#fff;pointer-events:none}
.distant-star{position:absolute;border-radius:50%;pointer-events:none;animation:realTwinkle var(--rs) ease-in-out infinite alternate}
@keyframes realTwinkle{from{opacity:var(--lo)}to{opacity:var(--hi)}}

/* Refined spacecraft */
.station{width:min(940px,90vw);filter:drop-shadow(0 20px 25px rgba(0,0,0,.82))}
.station svg{filter:contrast(1.04) saturate(.82)}
.station .array{filter:none!important}


/* CONSTELLATIONS */
#constellationField{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.constellation{position:absolute;overflow:visible;opacity:.34;animation:constellationFade 9s ease-in-out infinite alternate}
.constellation line{stroke:rgba(210,138,59,.42);stroke-width:.7;vector-effect:non-scaling-stroke}
.constellation circle{fill:#fff;stroke:#d28a3b;stroke-width:.45;filter:drop-shadow(0 0 2px rgba(210,138,59,.55))}
.constellation-label{fill:rgba(210,138,59,.65);font:7px "Courier New",monospace;letter-spacing:2px}
@keyframes constellationFade{from{opacity:.20}to{opacity:.42}}


/* ANIMATED TELEMETRY LINE GRAPHS */
#graphField{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}.telemetryGraph{position:absolute;width:190px;height:88px;opacity:.32;filter:drop-shadow(0 0 5px currentColor);animation:gfloat var(--gs) cubic-bezier(.45,.05,.55,.95) infinite alternate}.telemetryGraph.orange{color:var(--orange)}.telemetryGraph.green{color:var(--green)}.telemetryGraph.purple{color:var(--purple)}.telemetryGraph .grid{stroke:currentColor;stroke-width:.35;opacity:.13}.telemetryGraph .trace{fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.telemetryGraph .pt{fill:currentColor}.telemetryGraph text{fill:currentColor;font:6px "Courier New",monospace;letter-spacing:1px}@keyframes gfloat{0%{transform:translate3d(-5px,4px,0)}50%{transform:translate3d(5px,-5px,0)}100%{transform:translate3d(12px,-9px,0)}}

/* SMOOTH ANIMATED PIE CHARTS + DATA SETS */
#pieField,#datasetField{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.pieViz{position:absolute;width:108px;height:108px;opacity:.30;animation:pieFloat var(--ps) cubic-bezier(.45,.05,.55,.95) infinite alternate}
.pieViz svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 5px rgba(210,138,59,.16))}
.pieViz .ring-bg{fill:none;stroke:rgba(255,255,255,.055);stroke-width:8}
.pieViz .arc{fill:none;stroke-width:8;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.pieViz .a{stroke:var(--orange)}.pieViz .b{stroke:var(--purple)}.pieViz .c{stroke:#d7b17c}
.pieViz text{font:6px "Courier New",monospace;letter-spacing:1px;fill:rgba(230,190,135,.75)}
@keyframes pieFloat{0%{transform:translate3d(-5px,5px,0) rotate(-1deg)}50%{transform:translate3d(4px,-3px,0) rotate(.5deg)}100%{transform:translate3d(10px,-8px,0) rotate(1deg)}}

.dataSet{position:absolute;min-width:128px;padding:7px 9px;border-left:1px solid rgba(210,138,59,.28);background:linear-gradient(90deg,rgba(10,7,5,.24),transparent);font:7px "Courier New",monospace;letter-spacing:1px;opacity:.30;animation:dataSetFloat var(--ds) cubic-bezier(.45,.05,.55,.95) infinite alternate}
.dataSet .head{color:rgba(210,138,59,.82);margin-bottom:5px}
.dataSet .row{display:grid;grid-template-columns:1fr auto;gap:14px;margin:3px 0;color:rgba(225,216,199,.60)}
.dataSet .value{color:rgba(203,159,105,.80);transition:opacity .5s ease}
.dataSet .bar{height:1px;margin-top:3px;background:rgba(255,255,255,.05);overflow:hidden}
.dataSet .bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--orange),var(--purple));transition:width 1.8s cubic-bezier(.65,0,.35,1)}
@keyframes dataSetFloat{from{transform:translate3d(-4px,4px,0)}to{transform:translate3d(8px,-7px,0)}}

</style>
</head>
<body>
<div class="spaceGlow"><div class="milkyway"></div></div>
<div class="cosmic-galaxy galaxyA"></div>
<div class="cosmic-galaxy galaxyB"></div>
<div class="cosmic-galaxy galaxyC"></div>
<div id="deepStars"></div><div id="constellationField"></div><div id="newStars"></div><div id="graphField"></div><div id="pieField"></div><div id="datasetField"></div><div id="dataField"></div><div id="wordField"></div>

<div class="earth"></div>

<!-- Three twinkle sheets -->
<div class="star l1"></div><div class="star l2"></div><div class="star l3"></div>

<!-- Three staggered blink layers -->
<div class="blink"></div><div class="blink d2"></div><div class="blink d3"></div>

<!-- Station SVG (unchanged from previous answer) -->
<div class="station">
<svg viewBox="0 0 900 420" aria-label="CHI orbital research satellite">
<defs>
  <linearGradient id="bodyMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0ecdc"/><stop offset=".16" stop-color="#8c8c7c"/>
    <stop offset=".45" stop-color="#34362f"/><stop offset=".72" stop-color="#6d6f62"/>
    <stop offset="1" stop-color="#1b1d1a"/>
  </linearGradient>
  <linearGradient id="darkMetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#55584c"/><stop offset=".5" stop-color="#20221e"/><stop offset="1" stop-color="#111310"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f0bd69"/><stop offset=".5" stop-color="#d28a3b"/><stop offset="1" stop-color="#75451f"/>
  </linearGradient>
  <pattern id="cells" width="22" height="18" patternUnits="userSpaceOnUse">
    <rect width="22" height="18" fill="#17131d"/>
    <rect x="1" y="1" width="9" height="7" rx="1" fill="#24243a"/>
    <rect x="12" y="1" width="9" height="7" rx="1" fill="#191a2c"/>
    <rect x="1" y="10" width="9" height="7" rx="1" fill="#1c1d31"/>
    <rect x="12" y="10" width="9" height="7" rx="1" fill="#292943"/>
    <path d="M11 0V18M0 9H22" stroke="#b8b7c9" stroke-opacity=".22" stroke-width=".7"/>
  </pattern>
  <radialGradient id="window"><stop offset="0" stop-color="#c8b0e8"/><stop offset=".35" stop-color="#6d4b83"/><stop offset="1" stop-color="#15101b"/></radialGradient>
  <filter id="softGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- refined articulated solar wings -->
<g class="solar-wings" transform="rotate(-2 450 205)">
  <!-- left boom -->
  <path d="M382 190H322" stroke="#aaa99c" stroke-width="7"/>
  <path d="M322 190L302 181M322 190L302 199" stroke="#77796d" stroke-width="3"/>

  <!-- left array -->

    <rect x="0" y="0" width="258" height="112" rx="3" fill="#111016" stroke="#777181" stroke-width="2"/>
    <rect x="5" y="5" width="248" height="102" rx="2" fill="url(#cells)"/>
    <path d="M67 5V107M129 5V107M191 5V107M5 56H253" stroke="#c2b7ca" stroke-opacity=".35" stroke-width="1"/>
    <path d="M0 0L258 112M258 0L0 112" stroke="#9a9690" stroke-opacity=".16" stroke-width=".7"/>
    <rect x="124" y="-5" width="10" height="122" rx="2" fill="#24251f" stroke="#77796d" stroke-width="1"/>
  </g>

  <!-- right boom -->
  <path d="M518 190H578" stroke="#aaa99c" stroke-width="7"/>
  <path d="M578 190L598 181M578 190L598 199" stroke="#77796d" stroke-width="3"/>
  <circle cx="578" cy="190" r="7" fill="#24251f" stroke="#d28a3b" stroke-width="2"/>

  <!-- right array -->
  <g transform="translate(600 134)">
    <rect x="0" y="0" width="258" height="112" rx="3" fill="#111016" stroke="#777181" stroke-width="2"/>
    <rect x="5" y="5" width="248" height="102" rx="2" fill="url(#cells)"/>
    <path d="M67 5V107M129 5V107M191 5V107M5 56H253" stroke="#c2b7ca" stroke-opacity=".35" stroke-width="1"/>
    <path d="M0 0L258 112M258 0L0 112" stroke="#9a9690" stroke-opacity=".16" stroke-width=".7"/>
    <rect x="124" y="-5" width="10" height="122" rx="2" fill="#24251f" stroke="#77796d" stroke-width="1"/>
  </g>
</g>

<!-- central spacecraft bus -->
<g>
  <path d="M382 150 L425 125 L510 140 L535 190 L518 257 L470 282 L402 263 L365 215 Z" fill="url(#darkMetal)" stroke="#b9b9a8" stroke-width="2"/>
  <path d="M405 154 L440 139 L489 147 L505 174 L490 195 L414 194 L390 177 Z" fill="url(#bodyMetal)" stroke="#d7d7c8" stroke-width="1.5"/>
  <path d="M397 202 L500 202 L505 245 L469 263 L414 250 Z" fill="#282a25" stroke="#89905c" stroke-width="1.5"/>
  <circle cx="450" cy="201" r="42" fill="url(#bodyMetal)" stroke="#e1dece" stroke-width="2"/>
  <circle cx="450" cy="201" r="28" fill="#24261f" stroke="#d28a3b" stroke-width="2"/>
  <circle cx="450" cy="201" r="17" fill="url(#window)" stroke="#b58bd4" stroke-width="2" filter="url(#softGlow)"/>
  <circle cx="444" cy="195" r="5" fill="#eee6ff" opacity=".8"/>
</g>

<!-- upper instrument mast -->
<g>
  <path d="M450 159V90" stroke="#c8c7b6" stroke-width="5"/>
  <path d="M425 103H475" stroke="#89905c" stroke-width="4"/>
  <circle cx="450" cy="79" r="17" fill="url(#bodyMetal)" stroke="#d7d7c8" stroke-width="2"/>
  <circle cx="450" cy="79" r="7" fill="#9b6bd3" filter="url(#softGlow)"/>
  <path d="M450 62V37" stroke="#c8c7b6" stroke-width="3"/>
  <circle cx="450" cy="31" r="4" fill="#d28a3b" filter="url(#softGlow)"/>
</g>

<!-- dish -->
<g transform="translate(505 113) rotate(16)">
  <path d="M0 0 Q55 10 68 54 Q24 52 0 0Z" fill="#dedbc9" stroke="#77796c" stroke-width="2"/>
  <path d="M28 25L48 4" stroke="#d28a3b" stroke-width="3"/>
  <circle cx="50" cy="2" r="5" fill="#d28a3b"/>
</g>

<!-- lower propulsion / instruments -->
<g>
  <path d="M419 262L405 305H435L444 270" fill="url(#darkMetal)" stroke="#9aa060" stroke-width="2"/>

<div class="tag">CHIVISPUPPETS / ORBITAL ARCHIVE</div>
<script>
const deep=document.getElementById("deepStars");
deep.style.cssText="position:fixed;inset:0;z-index:1;pointer-events:none";
for(let i=0;i<900;i++){
  const s=document.createElement("i");
  const z=.25+Math.random()*.85;
  s.className="faint-star";
  s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;opacity:${.08+Math.random()*.35}`;
  deep.appendChild(s);
}
const colors=["orange","green","purple"], sf=document.getElementById("newStars");
for(let i=0;i<420;i++){let s=document.createElement("i"),z=Math.random()<.9?.5+Math.random()*1.5:2+Math.random()*2;s.className="dot "+(Math.random()>.82?colors[i%3]:"white");s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;--s:${2+Math.random()*6}s;animation-delay:${-Math.random()*7}s`;sf.appendChild(s)}
const df=document.getElementById("dataField"),items=[],labs=["CHI","ORBIT","ARCHIVE","PUPPET","MOV","VIS","FRAME","SIGNAL","WAYANG","X","Y"];
function val(){let t=Math.floor(Math.random()*3);if(t===0)return Math.floor(Math.random()*99999).toString().padStart(5,"0");if(t===1)return "0x"+Math.floor(Math.random()*65535).toString(16).toUpperCase().padStart(4,"0");return labs[Math.floor(Math.random()*labs.length)]+"_"+Math.floor(Math.random()*999).toString().padStart(3,"0")}
for(let i=0;i<65;i++){let d=document.createElement("span");d.className="data "+colors[i%3];d.textContent=val();d.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*96}%`;df.appendChild(d);items.push(d)}
setInterval(()=>items.forEach(d=>{if(Math.random()>.7)d.textContent=val()}),950);
const wf=document.getElementById("wordField"),words=["MOVEMENT","PUPPETRY","ARCHIVE","VISUAL","ORBIT","SPACE","INTERACTION","SANDBOX","WAYANG","MOTION","EXPLORE","SIGNAL"];
for(let i=0;i<15;i++){let w=document.createElement("span");w.className="word "+colors[i%3];w.textContent=words[i%words.length];w.style.cssText=`left:${Math.random()*87}%;top:${Math.random()*92}%;font-size:${13+Math.random()*20}px;--ws:${13+Math.random()*18}s;animation-delay:${-Math.random()*20}s`;wf.appendChild(w)}

// Subtle constellation layer
const constellationField=document.getElementById("constellationField");

const constellationData=[
  {
    name:"ORION",
    x:7,y:10,w:220,h:190,
    points:[[35,28],[88,45],[145,30],[102,83],[92,108],[112,111],[132,109],[78,158],[145,164]],
    lines:[[0,1],[1,2],[1,3],[3,4],[4,5],[5,6],[4,7],[6,8],[3,6]]
  },
  {
    name:"CASSIOPEIA",
    x:67,y:8,w:235,h:105,
    points:[[15,60],[60,28],[108,64],[158,24],[215,55]],
    lines:[[0,1],[1,2],[2,3],[3,4]]
  },
  {
    name:"URSA MAJOR",
    x:68,y:67,w:270,h:145,
    points:[[20,90],[62,63],[110,68],[145,92],[183,68],[218,50],[252,28]],
    lines:[[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]]
  },
  {
    name:"CYGNUS",
    x:8,y:66,w:220,h:155,
    points:[[108,15],[106,55],[105,95],[103,138],[40,76],[105,95],[178,70]],
    lines:[[0,1],[1,2],[2,3],[4,2],[2,6]]
  }
];

constellationData.forEach((c,index)=>{
  const ns="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${c.w} ${c.h}`);
  svg.classList.add("constellation");
  svg.style.left=c.x+"%";
  svg.style.top=c.y+"%";
  svg.style.width=c.w+"px";
  svg.style.height=c.h+"px";
  svg.style.animationDelay=`${-index*2.1}s`;

  c.lines.forEach(pair=>{
    const a=c.points[pair[0]],b=c.points[pair[1]];
    const line=document.createElementNS(ns,"line");
    line.setAttribute("x1",a[0]);line.setAttribute("y1",a[1]);
    line.setAttribute("x2",b[0]);line.setAttribute("y2",b[1]);
    svg.appendChild(line);
  });

  c.points.forEach((p,i)=>{
    const star=document.createElementNS(ns,"circle");
    star.setAttribute("cx",p[0]);star.setAttribute("cy",p[1]);
    star.setAttribute("r",i===0?2.2:1.6);
    svg.appendChild(star);
  });

  const label=document.createElementNS(ns,"text");
  label.setAttribute("x",8);
  label.setAttribute("y",c.h-5);
  label.setAttribute("class","constellation-label");
  label.textContent=c.name;
  svg.appendChild(label);

  constellationField.appendChild(svg);
});


const graphField=document.getElementById("graphField"),graphColors=["orange","green","purple"],graphNames=["ORBITAL FLUX","SIGNAL FEED","MOTION VECTOR","ARCHIVE DATA"];
function makeGraphPoints(){let p=[],y=38+Math.random()*15;for(let x=8;x<=182;x+=19){y=Math.max(13,Math.min(70,y+(Math.random()*22-11)));p.push([x,y])}return p}
for(let i=0;i<7;i++){
 const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");
 svg.setAttribute("viewBox","0 0 190 88");svg.classList.add("telemetryGraph",graphColors[i%3]);
 svg.style.cssText=`left:${4+Math.random()*78}%;top:${7+Math.random()*78}%;--gs:${15+Math.random()*15}s;animation-delay:${-Math.random()*14}s`;
 for(let x=10;x<190;x+=36){let l=document.createElementNS(ns,"line");l.setAttribute("x1",x);l.setAttribute("y1",10);l.setAttribute("x2",x);l.setAttribute("y2",76);l.setAttribute("class","grid");svg.appendChild(l)}
 for(let y=20;y<77;y+=19){let l=document.createElementNS(ns,"line");l.setAttribute("x1",7);l.setAttribute("y1",y);l.setAttribute("x2",184);l.setAttribute("y2",y);l.setAttribute("class","grid");svg.appendChild(l)}
 let pts=makeGraphPoints(),line=document.createElementNS(ns,"polyline");line.setAttribute("class","trace");line.setAttribute("points",pts.map(v=>v.join(",")).join(" "));svg.appendChild(line);
 let dots=[];for(let n=0;n<pts.length;n+=3){let c=document.createElementNS(ns,"circle");c.setAttribute("class","pt");c.setAttribute("r","1.5");svg.appendChild(c);dots.push(c)}
 let text=document.createElementNS(ns,"text");text.setAttribute("x","8");text.setAttribute("y","8");text.textContent=graphNames[i%graphNames.length];svg.appendChild(text);
 graphField.appendChild(svg);
 function draw(arr){
   line.setAttribute("points",arr.map(v=>v.join(",")).join(" "));
   dots.forEach((c,n)=>{const p=arr[n*3];if(p){c.setAttribute("cx",p[0]);c.setAttribute("cy",p[1])}});
 }
 draw(pts);
 function update(){
   const from=pts.map(p=>[p[0],p[1]]),to=makeGraphPoints(),duration=1800,start=performance.now();
   function animate(now){
     const raw=Math.min(1,(now-start)/duration);
     const t=raw<.5?4*raw*raw*raw:1-Math.pow(-2*raw+2,3)/2;
     const frame=from.map((p,n)=>[p[0]+(to[n][0]-p[0])*t,p[1]+(to[n][1]-p[1])*t]);
     draw(frame);
     if(raw<1)requestAnimationFrame(animate);else pts=to;
   }
   requestAnimationFrame(animate);
 }
 setInterval(update,4200+i*140);
}


// Animated pie/donut telemetry
const pieField=document.getElementById("pieField");
const pieNames=["ARCHIVE MIX","SIGNAL LOAD","MOTION DATA","ORBIT FEED"];
const piePositions=[[6,23],[83,18],[14,72],[76,73]];
const circumference=2*Math.PI*34;

for(let i=0;i<4;i++){
 const wrap=document.createElement("div");wrap.className="pieViz";
 wrap.style.left=piePositions[i][0]+"%";wrap.style.top=piePositions[i][1]+"%";
 wrap.style.setProperty("--ps",(18+i*3)+"s");
 wrap.innerHTML=`<svg viewBox="0 0 100 100">
 <circle class="ring-bg" cx="50" cy="50" r="34"/>
 <circle class="arc a" cx="50" cy="50" r="34"/>
 <circle class="arc b" cx="50" cy="50" r="34"/>
 <circle class="arc c" cx="50" cy="50" r="34"/>
 <text x="50" y="48" text-anchor="middle">${pieNames[i]}</text>
 <text class="piePct" x="50" y="58" text-anchor="middle">--</text></svg>`;
 pieField.appendChild(wrap);
 const arcs=[...wrap.querySelectorAll(".arc")],pct=wrap.querySelector(".piePct");
 function updatePie(){
   let a=18+Math.random()*48,b=12+Math.random()*Math.max(10,70-a),c=100-a-b;
   if(c<8){c=8;b=100-a-c}
   const vals=[a,b,c],offsets=[0,a,a+b];
   arcs.forEach((arc,n)=>{
     arc.style.transition="stroke-dasharray 2.2s cubic-bezier(.65,0,.35,1),stroke-dashoffset 2.2s cubic-bezier(.65,0,.35,1)";
     arc.style.strokeDasharray=`${circumference*vals[n]/100} ${circumference}`;
     arc.style.strokeDashoffset=`${-circumference*offsets[n]/100}`;
   });
   pct.textContent=Math.round(a)+" / "+Math.round(b)+" / "+Math.round(c);
 }
 updatePie();setInterval(updatePie,5200+i*240);
}

// Smooth changing background data sets
const datasetField=document.getElementById("datasetField");
const datasetNames=["CHI TELEMETRY","PUPPET MOTION","VISUAL INDEX","ARCHIVE STREAM"];
const metrics=[["FRAME","FLUX","SIGNAL"],["X MOVE","Y MOVE","ROTATE"],["LIGHT","DEPTH","FIELD"],["OBJECT","INDEX","SYNC"]];
const dsPos=[[28,10],[63,34],[29,80],[61,82]];

for(let i=0;i<4;i++){
 const box=document.createElement("div");box.className="dataSet";
 box.style.left=dsPos[i][0]+"%";box.style.top=dsPos[i][1]+"%";
 box.style.setProperty("--ds",(17+i*4)+"s");
 box.innerHTML=`<div class="head">${datasetNames[i]}</div>`+metrics[i].map((m,n)=>`<div class="row"><span>${m}</span><span class="value">000</span></div><div class="bar"><i style="--w:20%"></i></div>`).join("");
 datasetField.appendChild(box);
 const values=[...box.querySelectorAll(".value")],bars=[...box.querySelectorAll(".bar i")];
 function updateSet(){
   values.forEach((v,n)=>{
     const num=Math.floor(100+Math.random()*899),width=15+Math.random()*80;
     v.style.opacity=".18";
     setTimeout(()=>{v.textContent=num;v.style.opacity="1";bars[n].style.setProperty("--w",width+"%")},350+n*90);
   });
 }
 updateSet();setInterval(updateSet,4300+i*260);
}
