
<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ============================================================
       CHIVISPUPPETS
       ANIMATED BANNER
       AUTUMN ORANGE + OLIVE GREEN EDITION
       ============================================================ -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    CHIVISPUPPETS Banner
  </title>


  <style>


    /* ============================================================
       01. GLOBAL RESET
       ============================================================ */

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      background: #070603;

      overflow: hidden;
    }


    body {
      font-family:
        "Courier New",
        Courier,
        monospace;
    }



    /* ============================================================
       02. AUTUMN COLOR PALETTE

       DARK BACKGROUND
       #070603

       BURNT ORANGE
       #b65c23

       PUMPKIN ORANGE
       #d47e2f

       AMBER
       #ca8b3d

       DARK OLIVE
       #6f7842

       MOSS
       #7e7f4e

       SAGE OLIVE
       #898c5b
       ============================================================ */



    /* ============================================================
       03. MAIN BANNER
       ============================================================ */

    .banner {
      position: relative;

      width: 100%;
      height: 100%;

      min-height: 240px;

      overflow: hidden;

      isolation: isolate;

      background:

        radial-gradient(
          circle at 50% 50%,
          rgba(180, 87, 28, 0.20),
          transparent 34%
        ),

        radial-gradient(
          circle at 73% 32%,
          rgba(111, 120, 66, 0.11),
          transparent 30%
        ),

        radial-gradient(
          circle at 24% 68%,
          rgba(202, 139, 61, 0.08),
          transparent 27%
        ),

        linear-gradient(
          90deg,
          #070603 0%,
          #120b05 23%,
          #251305 50%,
          #111008 76%,
          #070603 100%
        );

      border-top:
        1px solid
        rgba(202, 139, 61, 0.55);

      border-bottom:
        1px solid
        rgba(111, 120, 66, 0.55);
    }



    /* ============================================================
       04. SOFT MOVING LIGHT
       ============================================================ */

    .moving-glow {
      position: absolute;

      top: -80%;
      left: -45%;

      width: 50%;
      height: 250%;

      background:
        radial-gradient(
          ellipse at center,
          rgba(212, 126, 47, 0.18),
          rgba(202, 139, 61, 0.08) 30%,
          transparent 68%
        );

      filter:
        blur(25px);

      opacity:
        0.85;

      animation:
        moveGlow
        9s
        linear
        infinite;

      pointer-events:
        none;

      z-index:
        1;
    }


    @keyframes moveGlow {

      0% {
        transform:
          translateX(0);
      }

      100% {
        transform:
          translateX(290vw);
      }

    }



    /* ============================================================
       05. SECOND OLIVE LIGHT
       ============================================================ */

    .olive-glow {
      position: absolute;

      top: -50%;
      right: -30%;

      width: 42%;
      height: 200%;

      background:
        radial-gradient(
          ellipse at center,
          rgba(126, 127, 78, 0.14),
          transparent 65%
        );

      filter:
        blur(35px);

      animation:
        oliveGlowMove
        12s
        ease-in-out
        infinite
        alternate;

      z-index:
        1;
    }


    @keyframes oliveGlowMove {

      from {
        transform:
          translateX(0)
          scale(0.95);
      }

      to {
        transform:
          translateX(-55vw)
          scale(1.15);
      }

    }



    /* ============================================================
       06. HORIZONTAL SCAN LINES
       ============================================================ */

    .scan-lines {
      position: absolute;

      inset: 0;

      z-index: 2;

      pointer-events: none;

      opacity: 0.20;

      background:

        repeating-linear-gradient(
          0deg,

          transparent 0px,
          transparent 8px,

          rgba(212, 126, 47, 0.12) 9px,

          transparent 10px,
          transparent 15px,

          rgba(111, 120, 66, 0.10) 16px,

          transparent 17px
        );

      animation:
        scanMove
        8s
        linear
        infinite;
    }


    @keyframes scanMove {

      from {
        transform:
          translateY(0);
      }

      to {
        transform:
          translateY(34px);
      }

    }



    /* ============================================================
       07. TOP NUMBER STREAM
       ============================================================ */

    .number-stream-top {
      position: absolute;

      top: 17px;
      left: 0;

      width: 220%;

      white-space: nowrap;

      font-size: 11px;

      letter-spacing: 8px;

      z-index: 4;

      animation:
        streamLeft
        26s
        linear
        infinite;
    }


    .number-stream-top span:nth-child(odd) {
      color:
        rgba(212, 126, 47, 0.60);
    }


    .number-stream-top span:nth-child(even) {
      color:
        rgba(126, 127, 78, 0.55);
    }


    @keyframes streamLeft {

      from {
        transform:
          translateX(0);
      }

      to {
        transform:
          translateX(-50%);
      }

    }



    /* ============================================================
       08. BOTTOM NUMBER STREAM
       ============================================================ */

    .number-stream-bottom {
      position: absolute;

      bottom: 15px;
      left: 0;

      width: 220%;

      white-space: nowrap;

      font-size: 10px;

      letter-spacing: 9px;

      z-index: 4;

      animation:
        streamRight
        31s
        linear
        infinite;
    }


    .number-stream-bottom span:nth-child(odd) {
      color:
        rgba(111, 120, 66, 0.52);
    }


    .number-stream-bottom span:nth-child(even) {
      color:
        rgba(202, 139, 61, 0.56);
    }


    @keyframes streamRight {

      from {
        transform:
          translateX(-50%);
      }

      to {
        transform:
          translateX(0);
      }

    }



    /* ============================================================
       09. MOVING TECH BARS
       ============================================================ */

    .tech-bar {
      position: absolute;

      height: 2px;

      z-index: 3;

      opacity: 0.70;

      pointer-events: none;
    }


    .bar-orange {
      background:
        #b65c23;

      box-shadow:
        0 0 8px
        rgba(182, 92, 35, 0.40);
    }


    .bar-green {
      background:
        #72784a;

      box-shadow:
        0 0 8px
        rgba(111, 120, 66, 0.40);
    }


    .bar-1 {
      top: 64px;

      left: -180px;

      width: 160px;

      animation:
        moveBar
        8s
        linear
        infinite;
    }


    .bar-2 {
      top: 96px;

      left: -120px;

      width: 90px;

      animation:
        moveBar
        11s
        linear
        infinite;
    }


    .bar-3 {
      bottom: 74px;

      left: -230px;

      width: 210px;

      animation:
        moveBar
        14s
        linear
        infinite;
    }


    .bar-4 {
      bottom: 54px;

      left: -100px;

      width: 75px;

      animation:
        moveBar
        9s
        linear
        infinite;
    }


    @keyframes moveBar {

      from {
        transform:
          translateX(0);
      }

      to {
        transform:
          translateX(calc(100vw + 450px));
      }

    }



    /* ============================================================
       10. CENTER RING
       ============================================================ */

    .center-ring {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 300px;
      height: 300px;

      transform:
        translate(-50%, -50%);

      border:
        1px solid
        rgba(202, 139, 61, 0.16);

      border-radius:
        50%;

      z-index:
        2;

      animation:
        ringPulse
        6s
        ease-in-out
        infinite
        alternate;
    }


    .center-ring::before {
      content: "";

      position: absolute;

      inset: 28px;

      border-radius:
        50%;

      border:
        1px dashed
        rgba(111, 120, 66, 0.15);
    }


    .center-ring::after {
      content: "";

      position: absolute;

      inset: 66px;

      border-radius:
        50%;

      border:
        1px solid
        rgba(212, 126, 47, 0.11);
    }


    @keyframes ringPulse {

      from {
        transform:
          translate(-50%, -50%)
          scale(0.95)
          rotate(0deg);

        opacity:
          0.55;
      }

      to {
        transform:
          translate(-50%, -50%)
          scale(1.08)
          rotate(12deg);

        opacity:
          1;
      }

    }



    /* ============================================================
       11. CENTER CONTENT
       ============================================================ */

    .center-content {
      position: absolute;

      left: 50%;
      top: 48%;

      transform:
        translate(-50%, -50%);

      width:
        100%;

      text-align:
        center;

      z-index:
        10;
    }



    /* ============================================================
       12. MAIN TITLE
       ============================================================ */

    .main-title {
      margin: 0;

      color:
        #c9782b;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size:
        clamp(
          34px,
          6.8vw,
          82px
        );

      font-weight:
        900;

      letter-spacing:
        0.11em;

      white-space:
        nowrap;

      text-shadow:

        0 0 7px
        rgba(182, 92, 35, 0.38),

        0 0 20px
        rgba(202, 139, 61, 0.14);

      animation:
        titleFloat
        5s
        ease-in-out
        infinite
        alternate;
    }


    @keyframes titleFloat {

      from {
        transform:
          translateY(-3px);
      }

      to {
        transform:
          translateY(4px);
      }

    }



    /* ============================================================
       13. TITLE LETTER ALTERNATION
       Orange + olive
       ============================================================ */

    .orange-text {
      color:
        #c66e2b;
    }


    .green-text {
      color:
        #85875b;
    }



    /* ============================================================
       14. TAGLINE
       ============================================================ */

    .tagline {
      margin-top:
        16px;

      color:
        #b98547;

      font-size:
        clamp(
          9px,
          1.25vw,
          14px
        );

      letter-spacing:
        0.28em;

      white-space:
        nowrap;

      text-transform:
        uppercase;
    }


    .tagline .orange {
      color:
        #c87932;
    }


    .tagline .green {
      color:
        #85875b;
    }


    .tagline .separator {
      color:
        #5f5635;

      margin:
        0 6px;
    }



    /* ============================================================
       15. SIDE ARROWS
       ============================================================ */

    .arrow {
      position: absolute;

      top: 69%;

      z-index:
        8;

      font-size:
        19px;

      letter-spacing:
        1px;
    }


    .arrow-left {
      left:
        7%;

      color:
        #bd672b;

      animation:
        arrowLeft
        1.5s
        ease-in-out
        infinite
        alternate;
    }


    .arrow-right {
      right:
        7%;

      color:
        #808452;

      animation:
        arrowRight
        1.5s
        ease-in-out
        infinite
        alternate;
    }


    @keyframes arrowLeft {

      from {
        transform:
          translateX(0);

        opacity:
          0.35;
      }

      to {
        transform:
          translateX(12px);

        opacity:
          1;
      }

    }


    @keyframes arrowRight {

      from {
        transform:
          translateX(0);

        opacity:
          0.35;
      }

      to {
        transform:
          translateX(-12px);

        opacity:
          1;
      }

    }



    /* ============================================================
       16. FLOATING PARTICLES
       ============================================================ */

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius:
        50%;

      z-index:
        5;

      animation:
        particleMove
        linear
        infinite;
    }


    .particle.orange {
      background:
        #c87932;

      box-shadow:
        0 0 6px
        rgba(200, 121, 50, 0.60);
    }


    .particle.green {
      background:
        #85875b;

      box-shadow:
        0 0 6px
        rgba(133, 135, 91, 0.55);
    }


    .p1 {
      left: 12%;
      top: 32%;

      animation-duration:
        8s;
    }


    .p2 {
      left: 27%;
      top: 77%;

      animation-duration:
        11s;
    }


    .p3 {
      left: 61%;
      top: 24%;

      animation-duration:
        9s;
    }


    .p4 {
      left: 83%;
      top: 64%;

      animation-duration:
        13s;
    }


    .p5 {
      left: 46%;
      top: 80%;

      animation-duration:
        10s;
    }


    .p6 {
      left: 72%;
      top: 42%;

      animation-duration:
        7s;
    }


    @keyframes particleMove {

      0% {
        transform:
          translate(0, 0);

        opacity:
          0;
      }

      20% {
        opacity:
          1;
      }

      100% {
        transform:
          translate(170px, -75px);

        opacity:
          0;
      }

    }



    /* ============================================================
       17. BOTTOM ACCENT LINE
       ============================================================ */

    .bottom-line {
      position: absolute;

      left: 50%;
      bottom: 42px;

      transform:
        translateX(-50%);

      width:
        54%;

      height:
        1px;

      z-index:
        5;

      background:
        linear-gradient(
          90deg,

          transparent,

          rgba(182, 92, 35, 0.70),

          rgba(202, 139, 61, 0.75),

          rgba(111, 120, 66, 0.75),

          transparent
        );
    }



    /* ============================================================
       18. SCREEN GRAIN
       ============================================================ */

    .grain {
      position: absolute;

      inset: 0;

      z-index:
        20;

      pointer-events:
        none;

      opacity:
        0.12;

      background-image:

        repeating-linear-gradient(
          0deg,

          rgba(255, 255, 255, 0.04)
          0px,

          rgba(255, 255, 255, 0.04)
          1px,

          transparent
          1px,

          transparent
          4px
        );
    }



    /* ============================================================
       19. RESPONSIVE DESIGN
       ============================================================ */

    @media screen and (max-width: 700px) {

      .main-title {
        font-size:
          clamp(
            29px,
            9vw,
            48px
          );

        letter-spacing:
          0.05em;
      }


      .tagline {
        font-size:
          9px;

        letter-spacing:
          0.13em;
      }


      .center-ring {
        width:
          220px;

        height:
          220px;
      }


      .arrow-left {
        left:
          2%;
      }


      .arrow-right {
        right:
          2%;
      }


      .number-stream-top,
      .number-stream-bottom {
        font-size:
          8px;

        letter-spacing:
          5px;
      }

    }


  </style>

</head>
