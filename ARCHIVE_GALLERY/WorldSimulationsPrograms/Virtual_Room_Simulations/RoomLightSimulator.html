    poly([[W*.018,-H*.043],[W*.023,-H*.060],[W*.033,-H*.045]],"#51473d");
    poly([[W*.036,-H*.049],[W*.049,-H*.060],[W*.050,-H*.041]],"#4b4138");
    x.fillStyle="#ad9982";x.beginPath();x.ellipse(W*.052,-H*.029,W*.009,H*.005,-.12,0,Math.PI*2);x.fill();
    x.fillStyle="#332b27";x.beginPath();x.arc(W*.059,-H*.031,1.45,0,Math.PI*2);x.fill();
    x.strokeStyle="#29231f";x.lineWidth=1.25;x.beginPath();x.moveTo(W*.033,-H*.037);x.quadraticCurveTo(W*.040,-H*.033,W*.046,-H*.037);x.stroke();

    // Sleeping tail: remains curled beside the body with a slow relaxed tip movement.
    const sleepTail=Math.sin(whiskerPhase*.20);
    x.strokeStyle="#4b4138";x.lineWidth=5.4;x.lineCap="round";x.beginPath();x.moveTo(-W*.042,-H*.005);
    x.bezierCurveTo(-W*.061,-H*(.016+sleepTail*.0015),-W*.061,-H*(.040-sleepTail*.0018),-W*.044,-H*.049);
    x.bezierCurveTo(-W*.031,-H*(.056+sleepTail*.0015),-W*(.020+sleepTail*.0025),-H*(.049-sleepTail*.0015),-W*(.020+sleepTail*.0035),-H*(.040+sleepTail*.0012));x.stroke();
    x.restore(); // sleeping breathing transform
    x.restore();return;
  }

  // WALKING / PLAYING BODY
  // Animated snake-like tail: several flowing bends travel from base to tip.
  const tailT=catStep*.42+whiskerPhase*.55;
  const tx0=-W*.038,ty0=-H*.012;
  const tailPts=[];
  for(let i=0;i<=9;i++){
    const u=i/9;
    const tx=tx0-W*(.0058+.0042*u)*i;
    const rise=-H*(.0044*i);
    const wave=Math.sin(tailT-i*.62)*H*(.0038+.0038*u);
    tailPts.push([tx,ty0+rise+wave]);
  }
  x.strokeStyle="#4b4138";x.lineWidth=5.2;x.lineCap="round";x.lineJoin="round";
  x.beginPath();x.moveTo(tailPts[0][0],tailPts[0][1]);
  for(let i=1;i<tailPts.length-1;i++){
    const mx=(tailPts[i][0]+tailPts[i+1][0])/2,my=(tailPts[i][1]+tailPts[i+1][1])/2;
    x.quadraticCurveTo(tailPts[i][0],tailPts[i][1],mx,my);
  }
  x.quadraticCurveTo(tailPts[8][0],tailPts[8][1],tailPts[9][0],tailPts[9][1]);x.stroke();

  let fur=x.createLinearGradient(-W*.047,-H*.055,W*.052,H*.008);
  fur.addColorStop(0,"#786c5e");fur.addColorStop(.52,"#5e5348");fur.addColorStop(1,"#413930");
  x.fillStyle=fur;x.beginPath();x.moveTo(-W*.046,-H*.010);
  x.bezierCurveTo(-W*.047,-H*.039,-W*.027,-H*.056,W*.006,-H*.052);
  x.bezierCurveTo(W*.027,-H*.050,W*.041,-H*.041,W*.047,-H*.025);
  x.bezierCurveTo(W*.038,-H*.007,W*.018,H*.002,-W*.013,H*.003);
  x.bezierCurveTo(-W*.033,H*.004,-W*.044,-H*.001,-W*.046,-H*.010);x.fill();

  // smoother neck/chest transition
  let neck=x.createLinearGradient(W*.014,-H*.060,W*.050,-H*.018);
  neck.addColorStop(0,"#62564a");neck.addColorStop(1,"#51473e");
  x.fillStyle=neck;x.beginPath();
  x.moveTo(W*.010,-H*.041);
  x.bezierCurveTo(W*.018,-H*.054,W*.026,-H*.061,W*.035,-H*.060);
  x.bezierCurveTo(W*.043,-H*.058,W*.049,-H*.050,W*.050,-H*.040);
  x.bezierCurveTo(W*.048,-H*.029,W*.041,-H*.019,W*.029,-H*.014);
  x.bezierCurveTo(W*.022,-H*.019,W*.016,-H*.029,W*.010,-H*.041);
  x.closePath();x.fill();

  // head
  x.fillStyle="#685c4f";x.beginPath();x.moveTo(W*.030,-H*.054);
  x.quadraticCurveTo(W*.041,-H*.071,W*.058,-H*.060);x.quadraticCurveTo(W*.071,-H*.051,W*.067,-H*.034);
  x.quadraticCurveTo(W*.061,-H*.021,W*.043,-H*.025);x.quadraticCurveTo(W*.029,-H*.031,W*.030,-H*.054);x.fill();
  poly([[W*.033,-H*.058],[W*.037,-H*.080],[W*.049,-H*.062]],"#554a40");
  poly([[W*.050,-H*.064],[W*.059,-H*.081],[W*.064,-H*.057]],"#4d433a");
  poly([[W*.037,-H*.062],[W*.039,-H*.073],[W*.045,-H*.064]],"#9a766c");
  poly([[W*.054,-H*.065],[W*.058,-H*.074],[W*.061,-H*.061]],"#927067");

  // face
  x.fillStyle="#b09b83";x.beginPath();x.ellipse(W*.063,-H*.036,W*.010,H*.006,-.08,0,Math.PI*2);x.fill();
  x.fillStyle="#342b27";x.beginPath();x.arc(W*.071,-H*.039,1.7,0,Math.PI*2);x.fill();
  x.fillStyle="#c7cf7d";x.beginPath();x.ellipse(W*.052,-H*.049,2.25,1.65,-.1,0,Math.PI*2);x.fill();
  x.fillStyle="#1f1e18";x.beginPath();x.ellipse(W*.0525,-H*.049,.65,1.4,0,0,Math.PI*2);x.fill();

  // Exactly four legs. In yarn mode, the existing front-right leg becomes the reaching paw.
  x.strokeStyle="#4b4239";x.lineWidth=4.3;x.lineCap="round";const ly=H*.019;
  const legs=[[-.028,-.028+stride/W],[-.010,-.008-stride/W],[.021,.019-stride/W]];
  x.beginPath();legs.forEach(([sx,ex])=>{x.moveTo(W*sx,-H*.004);x.lineTo(W*ex,ly)});x.stroke();
  x.fillStyle="#453c34";legs.forEach(([,ex])=>{x.beginPath();x.ellipse(W*(ex+.003),ly,W*.006,H*.003,0,0,Math.PI*2);x.fill()});
  if(catMode==="yarn"){
    const tap=(Math.sin(yarnPhase*1.7)+1)*.5;
    const reach=W*(.052+tap*.010);
    x.strokeStyle="#4b4239";x.lineWidth=4.3;x.beginPath();x.moveTo(W*.036,-H*.004);x.quadraticCurveTo(W*.047,H*.001,reach,H*.010);x.stroke();
    x.fillStyle="#453c34";x.beginPath();x.ellipse(reach,H*.010,W*.006,H*.003,0,0,Math.PI*2);x.fill();
  }else{
    x.strokeStyle="#4b4239";x.lineWidth=4.3;x.beginPath();x.moveTo(W*.036,-H*.004);x.lineTo(W*(.041+stride/W),ly);x.stroke();
    x.fillStyle="#453c34";x.beginPath();x.ellipse(W*(.044+stride/W),ly,W*.006,H*.003,0,0,Math.PI*2);x.fill();
  }
  x.restore();
}
drawFloatingData(W,H);
drawMouseScene();
drawCat();

// chandelier — ROOM LIGHT also powers the chandelier with a smooth warm fade
if(lightLevel>.005){
  let chg=x.createRadialGradient(W*.52,H*.16,2,W*.52,H*.16,W*.25);
  chg.addColorStop(0,`rgba(255,210,132,${.18*lightLevel})`);
  chg.addColorStop(.45,`rgba(255,184,92,${.065*lightLevel})`);
  chg.addColorStop(1,"rgba(255,170,70,0)");

x.strokeStyle="#b78b50";x.lineWidth=2;x.beginPath();x.moveTo(W*.52,0);x.lineTo(W*.52,H*.105);x.stroke();
x.fillStyle="#b78b50";x.beginPath();x.arc(W*.52,H*.115,8,0,7);x.fill();
for(let a=-2;a<=2;a++){
  x.strokeStyle="#a87b43";x.beginPath();x.moveTo(W*.52,H*.12);x.quadraticCurveTo(W*(.52+a*.025),H*.15,W*(.52+a*.045),H*.16);x.stroke();
  const bx=W*(.52+a*.045),by=H*.16;
  if(lightLevel>.005){
    let bg=x.createRadialGradient(bx,by,1,bx,by,14+12*lightLevel);

    bg.addColorStop(.25,`rgba(255,198,103,${.34*lightLevel})`);
    bg.addColorStop(1,"rgba(255,170,70,0)");
    x.fillStyle=bg;x.beginPath();x.arc(bx,by,14+12*lightLevel,0,Math.PI*2);x.fill();
  }
  x.fillStyle=lightLevel>.01?`rgba(255,225,157,${.45+.55*lightLevel})`:"#8f724d";
  x.beginPath();x.arc(bx,by,3,0,7);x.fill();
}
// subtle luxury rug border
x.strokeStyle="rgba(218,174,104,.38)";x.lineWidth=2;x.strokeRect(W*.36,H*.765,W*.38,H*.13);x.strokeStyle="rgba(218,174,104,.16)";x.strokeRect(W*.375,H*.78,W*.35,H*.10);

clock.textContent=cyclePlaying?fmtMinutes(clockDisplayMinutes):fmt(t);
phase.textContent=t<5?"DEEP NIGHT":t<6?"PRE-DAWN":t<7.5?"SUNRISE":t<11?"MORNING LIGHT":t<14?"MIDDAY":t<17.5?"AFTERNOON LIGHT":t<19.3?"GOLDEN HOUR":t<=20?"DUSK":t<23?"MOONLIGHT":"DEEP NIGHT";
angle.textContent=daylight?`SUN ${Math.round(alt*68)}°`:`MOON ${Math.round(moonAlt*62)}°`}
function resize(){let r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);c.width=r.width*d;c.height=r.height*d;x.setTransform(d,0,0,d,0,0);draw()}new ResizeObserver(resize).observe(c);
function go(){let d=target-cur;if(Math.abs(d)<.002){cur=target;draw();raf=0;return}cur+=d*.09;draw();raf=requestAnimationFrame(go)}
function set(v){target=Math.max(0,Math.min(24,+v));s.value=target;if(!raf)raf=requestAnimationFrame(go)}
function stopCycle(){
  cyclePlaying=false;cyclePlayBtn.textContent="▶ PLAY DAY / NIGHT";cyclePlayBtn.classList.remove("on");
  if(cycleRAF){cancelAnimationFrame(cycleRAF);cycleRAF=0}
}
function cycleFrame(ts){
  if(!cyclePlaying)return;
  if(!cycleLast)cycleLast=ts;
  const dt=Math.min(50,ts-cycleLast);cycleLast=ts;
  // One complete 24-hour cycle takes about 28 seconds.
  const hourAdvance=dt*(24/28000);
  cur+=hourAdvance;
  clockDisplayMinutes+=hourAdvance*60;
  if(cur>=24)cur-=24;
  if(clockDisplayMinutes>=1440)clockDisplayMinutes-=1440;
  target=cur;s.value=cur;draw();
  cycleRAF=requestAnimationFrame(cycleFrame);
}
function startCycle(){
  if(cyclePlaying){stopCycle();return}
  if(raf){cancelAnimationFrame(raf);raf=0}
  cyclePlaying=true;cycleLast=0;clockDisplayMinutes=cur*60;
  cyclePlayBtn.textContent="❚❚ PAUSE DAY / NIGHT";cyclePlayBtn.classList.add("on");
  cycleRAF=requestAnimationFrame(cycleFrame);
}

dataToggleBtn.addEventListener("click",()=>{
  dataVisible=!dataVisible;
  dataOpacityTarget=dataVisible?1:0;
  dataToggleBtn.textContent=dataVisible?"BACKGROUND DATA ON":"BACKGROUND DATA OFF";
  dataToggleBtn.classList.toggle("on",dataVisible);
});
cyclePlayBtn.addEventListener("click",startCycle);
s.addEventListener("input",()=>{stopCycle();set(s.value)});
document.querySelectorAll("button[data-t]").forEach(b=>b.addEventListener("click",()=>{stopCycle();set(b.dataset.t)}));
incenseBtn.addEventListener("click",()=>{incenseOn=!incenseOn;incenseBtn.textContent=incenseOn?"TURN OFF":"TURN ON";incenseBtn.classList.toggle("on",incenseOn);startRoomEffects()});
lightBtn.addEventListener("click",()=>{wallLightOn=!wallLightOn;lightBtn.textContent=wallLightOn?"SWITCH OFF":"SWITCH ON";lightBtn.classList.toggle("on",wallLightOn);startRoomEffects()});
curtainSlider.addEventListener("input",()=>{curtainClose=+curtainSlider.value;draw()});
let roomEffectsRAF=0;
function roomEffectsLoop(){
  incenseLevel+=( (incenseOn?1:0)-incenseLevel )*.045;
  lightLevel+=( (wallLightOn?1:0)-lightLevel )*.055;
  if(Math.abs((incenseOn?1:0)-incenseLevel)<.002)incenseLevel=incenseOn?1:0;
  if(Math.abs((wallLightOn?1:0)-lightLevel)<.002)lightLevel=wallLightOn?1:0;
  draw();
  if(incenseLevel>0||lightLevel>0||incenseOn||wallLightOn){roomEffectsRAF=requestAnimationFrame(roomEffectsLoop)}
  else roomEffectsRAF=0;
}
function startRoomEffects(){if(!roomEffectsRAF)roomEffectsRAF=requestAnimationFrame(roomEffectsLoop)}
function chooseCatTarget(){
  const spots=[[.31,.82],[.48,.80],[.63,.82],[.76,.79],[.88,.82],[.58,.75],[.35,.76]];
  const p=spots[Math.floor(Math.random()*spots.length)];catTX=p[0];catTY=p[1];catDir=catTX>=catX?1:-1;
}
function setCatMode(mode){
  catMode=mode;catPause=0;catPoseBlend=0;yarnDragging=false;
  mouseActive=mode==="mouse";
  yarnBtn.classList.toggle("on",mode==="yarn");
  sitBtn.classList.toggle("on",mode==="sit");
  sleepBtn.classList.toggle("on",mode==="sleep");
  mouseBtn.classList.toggle("on",mode==="mouse");
  yarnBtn.textContent=mode==="yarn"?"PLAYING…":"PLAY WITH YARN";
  sitBtn.textContent=mode==="sit"?"SITTING":"SIT";
  sleepBtn.textContent=mode==="sleep"?"SLEEPING":"GO TO SLEEP";
  mouseBtn.textContent=mode==="mouse"?"CHASING MOUSE…":"MOUSE";

  if(mode==="yarn"){
    yarnX=Math.max(.18,Math.min(.82,catX+(catDir>0?.12:-.12)));yarnY=.805;
    catTX=catX;catTY=catY;
  }else if(mode==="sit"||mode==="sleep"){
    catTX=catX;catTY=catY;
  }else if(mode==="mouse"){
    // Mouse begins at the wall hole and runs across the floor.
    mouseX=.805;mouseY=.805;mousePhase=0;mouseEscaping=false;mouseVX=-.00165;mouseSpawn=0;tomBlend=0;
    catDir=mouseX>=catX?1:-1;catTX=mouseX-catDir*.075;catTY=mouseY-.012;
  }else chooseCatTarget();
}
catToggleBtn.addEventListener("click",()=>{
  catVisible=!catVisible;catVisibilityTarget=catVisible?1:0;
  catToggleBtn.classList.toggle("on",!catVisible);
  catToggleBtn.textContent=catVisible?"HIDE CAT":"SPAWN CAT";
  if(!catVisible){
    mouseActive=false;
    yarnBtn.classList.remove("on");sitBtn.classList.remove("on");sleepBtn.classList.remove("on");mouseBtn.classList.remove("on");
    yarnBtn.textContent="PLAY WITH YARN";sitBtn.textContent="SIT";sleepBtn.textContent="GO TO SLEEP";mouseBtn.textContent="MOUSE";
    catMode="roam";catTX=catX;catTY=catY;
  }else{
    catMode="roam";catPause=18;chooseCatTarget();
  }
});
yarnBtn.addEventListener("click",()=>{
  if(!catVisible){catVisible=true;catVisibilityTarget=1;catToggleBtn.classList.remove("on");catToggleBtn.textContent="HIDE CAT";}
  setCatMode(catMode==="yarn"?"roam":"yarn");
});
sitBtn.addEventListener("click",()=>{
  if(!catVisible){catVisible=true;catVisibilityTarget=1;catToggleBtn.classList.remove("on");catToggleBtn.textContent="HIDE CAT";}
  setCatMode(catMode==="sit"?"roam":"sit");
});
sleepBtn.addEventListener("click",()=>{
  if(!catVisible){catVisible=true;catVisibilityTarget=1;catToggleBtn.classList.remove("on");catToggleBtn.textContent="HIDE CAT";}
  setCatMode(catMode==="sleep"?"roam":"sleep");
});
mouseBtn.addEventListener("click",()=>{
  if(!catVisible){catVisible=true;catVisibilityTarget=1;catToggleBtn.classList.remove("on");catToggleBtn.textContent="HIDE CAT";}
  setCatMode(catMode==="mouse"?"roam":"mouse");
});
function catLoop(){
  catVisibility+=(catVisibilityTarget-catVisibility)*.070;
  if(Math.abs(catVisibilityTarget-catVisibility)<.0015)catVisibility=catVisibilityTarget;
  whiskerPhase+=.015;
  catPoseBlend+=(1-catPoseBlend)*.075;
  if(catPoseBlend>.995)catPoseBlend=1;
  if(catMode==="mouse"){
    mousePhase+=.14;

    // Mouse eases out of the hole first.
    mouseSpawn+=(1-mouseSpawn)*.060;
    const se=mouseSpawn*mouseSpawn*(3-2*mouseSpawn);
    tomBlend=Math.max(0,Math.min(1,(mouseSpawn-.20)/.68));

    if(mouseSpawn<.94){
      mouseVX=-.0012;
      mouseX=.805-.105*se;
      mouseY=.805-Math.sin(se*Math.PI)*.005;
    }else{
      if(Math.abs(mouseVX)<.001)mouseVX=-.00165;
      mouseX+=mouseVX;
      if(mouseX>=.91){mouseX=.91;mouseVX=-Math.abs(mouseVX)}
      if(mouseX<=.11){mouseX=.11;mouseVX=Math.abs(mouseVX)}
      mouseY=.805+Math.abs(Math.sin(mousePhase*1.7))*.003;
    }

    // Cat stays behind the mouse and eases into the chase.
    const chaseDir=mouseVX>=0?1:-1;
    catDir=chaseDir;
    catTX=Math.max(.08,Math.min(.92,mouseX-chaseDir*.110));
    catTY=Math.max(.74,Math.min(.84,mouseY-.010));
    if(chaseDir>0&&catX>mouseX-.050)catX=mouseX-.050;
    if(chaseDir<0&&catX<mouseX+.050)catX=mouseX+.050;
  }else if(catMode==="yarn"){
    yarnPhase+=.045;
    // The ball only rocks/rolls a little when "batted" instead of racing around.
    if(!yarnDragging){
      yarnX+=Math.sin(yarnPhase*.75)*.000035;
      yarnY=.805-Math.max(0,Math.sin(yarnPhase*1.7))*.0025;
    }
    catDir=yarnX>=catX?1:-1;
    catTX=Math.max(.08,Math.min(.92,yarnX-catDir*.080));
    catTY=Math.max(.72,Math.min(.84,yarnY-.015));
  }else if(catMode==="sit"){
    catTX=catX;catTY=catY;
  }else if(catMode==="sleep"){
    catTX=catX;catTY=catY;
  }
  const dx=catTX-catX,dy=catTY-catY,d=Math.hypot(dx,dy);
  if(catMode==="sleep"&&d<.018){/* fixed position; breathing continues */}
  else if(catMode==="sit"&&d<.018){/* fixed position; breathing continues */}
  else if(catPause>0&&catMode==="roam"){catPause--;if(catPause===0)chooseCatTarget();}
  else if(d<.012){
    if(catMode==="roam")catPause=70+Math.floor(Math.random()*150);
    else catStep+=.08;
  }else{
    const speed=catMode==="mouse"?.00135:catMode==="yarn"?.00105:.00075;
    catX+=dx/d*speed;catY+=dy/d*speed*.55;catStep+=catMode==="mouse"?.25:catMode==="yarn"?.22:.16;
  }
  if(!incenseOn)draw();
  catRAF=requestAnimationFrame(catLoop);
}
// Drag the yarn with mouse or touch; the cat follows it.
function yarnPoint(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
c.addEventListener("pointerdown",e=>{if(catMode!=="yarn")return;const p=yarnPoint(e);if(Math.hypot(p.x-yarnX,p.y-yarnY)<.05){yarnDragging=true;if(c.setPointerCapture)c.setPointerCapture(e.pointerId);c.style.cursor="grabbing";e.preventDefault()}});
c.addEventListener("pointermove",e=>{const p=yarnPoint(e);if(yarnDragging){yarnX=Math.max(.06,Math.min(.94,p.x));yarnY=Math.max(.68,Math.min(.88,p.y));catDir=yarnX>=catX?1:-1;catTX=Math.max(.08,Math.min(.92,yarnX-catDir*.080));catTY=Math.max(.72,Math.min(.84,yarnY-.015));c.style.cursor="grabbing";e.preventDefault()}else if(catMode==="yarn"){c.style.cursor=Math.hypot(p.x-yarnX,p.y-yarnY)<.05?"grab":"default"}});
function dropYarn(e){if(!yarnDragging)return;yarnDragging=false;if(c.releasePointerCapture)try{c.releasePointerCapture(e.pointerId)}catch(_){}c.style.cursor="grab"}
c.addEventListener("pointerup",dropYarn);c.addEventListener("pointercancel",dropYarn);
chooseCatTarget();resize();catLoop()})();
