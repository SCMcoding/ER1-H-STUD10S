<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Projects</title>
  <link rel="stylesheet" type="text/css" href="../css/mystyle.css">
  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'Courier New', Geneva, sans-serif;
      margin: 0;
      padding: 0;
    }
    .banner-container {
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .banner {
      width: 100%;
      height: auto;
      display: block;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: center;
      background-color: #333;
    }
    ul li {
      margin: 0 15px;
    }
    ul li a {
      text-decoration: none;
      color: white;
      padding: 10px 20px;
      display: block;
    }
    ul li a:hover {
      background-color: #555;
    }
    /* Scale down only the content wrapper below nav */
    .content-wrapper {
      transform: scale(0.85);
      transform-origin: top center;
    }
    iframe {
      display: block;
      width: 80%;
      height: 80vh;
      margin: 20px auto;
      border: 4px solid grey;
      border-radius: 8px;
    }
    .game-description {
      width: 80%;
      margin: 30px auto;
      background-color: #222;
      border: 2px solid grey;
      border-radius: 8px;
      padding: 20px;
      line-height: 1.5;
      font-size: 0.9rem;
    }
    .game-description h2 {
      text-align: center;
      margin: 20px 0 10px;
      font-size: 1.3rem;
    }
    .game-description ul {
      list-style: disc;
      margin-left: 20px;
    }
    .section-image {
      display: block;
      max-width: 40%;
      margin: 20px auto;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  </div>

  <!-- Navigation Menu (unchanged) -->

        <li><a href="Home.html">Home</a></li>

       </ul>

</body>
</html>
