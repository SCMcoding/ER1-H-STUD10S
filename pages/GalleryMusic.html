<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery Page</title>
  <style>
    :root {
      --bg-dark: #000;
      --bg-nav: #222;
      --bg-hover: #555;
      --text-light: #fff;
      --container-max: 1200px;
      --gap: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Courier New', monospace;
      line-height: 1.6;
    }

    .top-section {
      width: 100%;
    }

    header {
      width: 100%;
    }

    header img.banner {
      width: 100%;
      height: auto;
      max-height: 300px;
      object-fit: cover;
      display: block;
    }

    nav {
      background: var(--bg-nav);
      width: 100%;
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    nav li + li {
      margin-left: var(--gap);
    }

    nav a {
      display: block;
      padding: 15px 20px;
      color: var(--text-light);
      text-decoration: none;
      transition: background 0.3s;
    }

    nav a:hover {
      background: var(--bg-hover);
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: var(--gap);
    }

    section {
      margin-bottom: calc(var(--gap) * 3);
    }

    section h2 {
      font-size: 1.75rem;
      text-align: center;
      margin-bottom: var(--gap);
    }

    .video-row {
      display: flex;
      flex-wrap: wrap;
      gap: var(--gap);
      justify-content: center;
    }

    .video-box {
      flex: 1 1 300px;
      max-width: 400px;
      aspect-ratio: 16 / 9;
      position: relative;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .video-box iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
    }

    @media (max-width: 600px) {
      nav ul {
        flex-direction: column;
        align-items: center;
      }

      nav li + li {
        margin-left: 0;
        margin-top: var(--gap);
      }
    }
  </style>
</head>
